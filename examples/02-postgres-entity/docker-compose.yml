services:
  postgres:
    image: postgres:17-alpine
    container_name: entlite-postgres-02
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: entlite
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d entlite"]
      interval: 1s
      timeout: 3s
      retries: 30
