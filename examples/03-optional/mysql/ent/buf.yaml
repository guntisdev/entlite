version: v2
modules:
  - path: contract/proto
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
  rpc_allow_google_protobuf_empty_responses: true
breaking:
  use:
    - FILE
deps:
  - buf.build/bufbuild/protovalidate
